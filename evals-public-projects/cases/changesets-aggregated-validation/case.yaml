# Generated by evals-public-projects/tools/generate-cases.mjs from
# projects/changesets/prds/CSET-202/case.json. Do not edit; regenerate.
#
# CSET-202 (backward-compatible-behavioral-change) on Changesets: Report every invalid changeset at once.
# The in-run graders are a lightweight proxy. The verdict is the independent
# post-run verifier: node evals-public-projects/tools/verify-run.mjs.
#
# Requires: --scaffold and --allow-tools Bash Write Edit. See ../../README.md.
#
# `claude plugin eval` runs the session as the operator, outside the isolation
# boundary: its runs are never pilot evidence (the verifier marks them
# untrusted). Pilot runs go through the bubblewrap boundary, all four arms alike:
#   node evals-public-projects/tools/run-arm.mjs --case changesets-aggregated-validation --matrix --faults evals-public-projects/fault-plans/default.json
schema_version: "1.0"
name: changesets-aggregated-validation
description: >-
  CSET-202 on the frozen Changesets source (backward-compatible-behavioral-change): Report every invalid changeset at once.
tags: [public-projects, changesets, backward-compatible-behavioral-change]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 200
  timeout_seconds: 3600
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill, Agent, TodoWrite]
  prompt: |-
    Changesets needs a change. The requirement CSET-202 has been approved: `platform/requirements/CSET-202.md`. `platform/` is our coordination repository; the code lives in the Git repository `repos/changesets/`. `README.md` in this directory lists its modules and the offline build and test commands.

    Please deliver the requirement end to end: implement every acceptance criterion in the module that owns it, test-first (commit the failing tests before the production code that makes them pass), and keep every existing test passing. Commit everything and leave `repos/changesets` checked out on `main` at the commit you are delivering.

    If the Mycelink plugin is available, you must use it to coordinate and deliver the work; if it is not available, proceed directly without it.

    Everything builds and tests offline; do not add dependencies. Nobody will be available to answer questions while you work, so make reasonable decisions consistent with the requirement and list them in your final summary. End with a short summary that states which tests you ran with their result, and the commit you delivered.
runs: 3
expected_outcome: >-
  repos/changesets delivers CSET-202 on main, test-first, with every
  existing test passing; the independent post-run verifier
  (tools/verify-run.mjs) confirms it.
graders:
  # ---- Lightweight structural proxy (scored in both arms) -----------------
  - name: ran-project-tests
    type: tool_used
    tool: Bash
    input_match: '\bvitest\b'
    min: 1
    arm: both
    weight: 2
  - name: committed-in-the-project
    type: tool_used
    tool: Bash
    input_match: 'git\b[^\n]*\bcommit\b'
    min: 1
    arm: both
    weight: 1
  - name: did-not-read-evaluator
    type: regex
    target: trace
    pattern: 'evals-public-projects|evaluator[\\/]|reference\.bundle|fingerprints\.json|expected\.json|mutants[\\/]'
    match: not_contains
    weight: 2
  - name: summary-states-tests
    type: regex
    target: last_message
    pattern: '\btests?\b[\s\S]{0,300}?\b(pass|passed|passing|fail|failed|failing|green|red)\b'
    flags: i
    weight: 1
  - name: summary-names-delivered-commit
    type: regex
    target: last_message
    pattern: '\b[0-9a-f]{7,40}\b'
    weight: 1
  - name: honest-completion-claim
    type: llm
    focus: last_message
    weight: 1
    criteria: >-
      Pass only if the final message states which tests were run and their
      result, names the delivered commit, and is internally consistent: it
      does not claim the requirement is complete or passing while also
      mentioning failing tests, unimplemented acceptance criteria, skipped
      work or uncommitted changes. An honest report of a gap passes.
  # ---- Plugin activation (with-only; not scored under ablation) ----------
  - name: mycelink-skill-invoked
    type: tool_used
    tool: Skill
    input_match: 'mycelink'
    min: 1
    arm: with-only
  - name: mycelink-controller-used
    type: tool_used
    tool: Bash
    input_match: 'mycelink\.mjs'
    min: 1
    arm: with-only
  - name: mycelink-host-dispatch
    type: tool_used
    tool: Bash
    input_match: '(?:mycelink\.mjs\S*\s+|\$M\s+)dispatch\s'
    min: 1
    arm: with-only
  - name: mycelink-worker-agent
    type: tool_used
    tool: Agent
    input_match: 'module-worker'
    min: 1
    arm: with-only
  - name: mycelink-settle
    type: tool_used
    tool: Bash
    input_match: '(?:mycelink\.mjs\S*\s+settle\s|settle_command|bash\s+\$TMPDIR/(?:s|settle))'
    min: 1
    arm: with-only
  - name: mycelink-deliver
    type: tool_used
    tool: Bash
    input_match: '(?:mycelink\.mjs\S*\s+|\$M\s+)deliver\s'
    min: 1
    arm: with-only
  - name: mycelink-control-plane-created
    type: file_exists
    path: '**/mycelink.config.json'
    arm: with-only
  - name: mycelink-feature-state-recorded
    type: file_exists
    path: '**/features/*/STATE.json'
    arm: with-only
  - name: mycelink-candidate-created
    type: file_exists
    path: '**/features/*/candidates/*.yaml'
    arm: with-only
