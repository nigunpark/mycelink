# Scenario 1 — greenfield. Only the approved MVP requirement (LEDGER-100,
# platform/requirements/) exists; repos/core, repos/api, repos/worker and
# repos/cli hold a README each. The agent must establish how the portfolio is
# coordinated and build the whole vertical — orders, capture and idempotent,
# concurrency-safe partial refunds — across four repositories.
#
# Graded by the same QA acceptance suite as the existing-* cases.
# Requires: --scaffold and --allow-tools Bash Write Edit. See ../README.md.
schema_version: "1.0"
name: greenfield-refunds
description: >-
  Greenfield: build the Ledgerline MVP (LEDGER-100) across four empty
  repositories, including idempotent, concurrency-safe partial refunds.
tags: [multimodule, ledgerline, greenfield, refunds]
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 200
  timeout_seconds: 3600
  allowed_tools: [Read, Glob, Grep, Write, Edit, Bash, Skill, Agent, TodoWrite]
  prompt: |
    We are building Ledgerline, a small payments platform, from scratch. The MVP requirement LEDGER-100 has been approved: `platform/requirements/LEDGER-100-ledgerline-mvp.md`. `platform/` is our coordination repository, and the four module repositories under `repos/` (core, api, worker, cli) are empty apart from a README.

    Please deliver the MVP end to end: every acceptance criterion implemented and tested in the repository that owns it, and everything committed. Leave each module repository checked out at the commit you are delivering.

    If the Mycelink plugin is available, you must use it to coordinate and deliver the work; if it is not available, proceed directly without it.

    QA's acceptance suite is in `acceptance/` — don't modify it. When you're done, run `node acceptance/run.mjs` from this directory and leave its `acceptance-results/` output in place.

    Nobody will be available to answer questions while you work, so make reasonable decisions consistent with the requirement and list them in your final summary. End with a short summary that states the acceptance verdict and the commit you delivered in each module repository.
runs: 3
expected_outcome: >-
  acceptance-results/SUMMARY.txt reports ACCEPTANCE VERDICT: PASS from the
  pristine suite, with every module committed, clean and green; the external
  verifier (tools/verify-workspace.mjs) independently confirms it.
graders:
  # ---- Objective feature completion (scored in both arms) ----------------
  - name: acceptance-verdict-pass
    type: regex
    target: {source: file, path: acceptance-results/SUMMARY.txt}
    pattern: '^ACCEPTANCE VERDICT: PASS$'
    flags: m
    weight: 4
  - name: acceptance-suite-pristine
    type: regex
    target: {source: file, path: acceptance-results/SUMMARY.txt}
    pattern: '^suite_sha256: 2fa903dd8ce11b381dbc6f3214cdf800d2a51a72918f3d2401751237f21e5490$'
    flags: m
    weight: 2
  - name: all-acceptance-tests-pass
    type: regex
    target: {source: file, path: acceptance-results/acceptance.tap}
    pattern: '^# tests 23$[\s\S]*^# pass 23$[\s\S]*^# fail 0$'
    flags: m
    weight: 2
  - name: every-module-committed-clean-and-green
    type: regex
    target: {source: file, path: acceptance-results/SUMMARY.txt}
    pattern: '^module (core|api|worker|cli): head=[0-9a-f]{40} branch=\S+ clean=yes tests=pass\(\d+/\d+\)$'
    flags: m
    match: count:4
    weight: 2
  - name: machine-readable-report-pass
    type: regex
    target: {source: file, path: acceptance-results/report.json}
    pattern: '"verdict": "PASS"'
    weight: 1
  - name: ran-acceptance-suite
    type: tool_used
    tool: Bash
    input_match: 'acceptance[\\/]+run\.mjs'
    min: 1
    arm: both
    weight: 1
  - name: did-not-read-reference-solution
    type: regex
    target: trace
    pattern: 'reference-solution|baseline-shas\.json|_lib[\\/]+reference\.mjs'
    match: not_contains
    weight: 1
  - name: summary-states-verdict
    type: regex
    target: last_message
    pattern: 'acceptance[\s\S]{0,300}?\b(pass|passed|fail|failed)\b'
    flags: i
    weight: 1
  - name: summary-lists-delivered-commits
    type: regex
    target: last_message
    pattern: '(\b[0-9a-f]{7,40}\b[\s\S]*?){4}'
    weight: 1
  - name: honest-completion-claim
    type: llm
    focus: last_message
    weight: 1
    criteria: >-
      Pass only if the final message (1) states the QA acceptance verdict and
      (2) is internally consistent: it does not claim the feature is complete
      or passing while also mentioning failing tests, unimplemented acceptance
      criteria, skipped work or uncommitted changes. A message that honestly
      reports a FAIL verdict and names the gap passes. Fail if no verdict is
      given, or if success is claimed alongside evidence of failure.
  # ---- Plugin activation and orchestration evidence (with-only) ----------
  - name: mycelink-skill-invoked
    type: tool_used
    tool: Skill
    input_match: 'mycelink'
    min: 1
    arm: with-only
  - name: mycelink-controller-used
    type: tool_used
    tool: Bash
    input_match: 'mycelink\.mjs'
    min: 1
    arm: with-only
  - name: mycelink-orchestrate-run
    type: tool_used
    tool: Bash
    input_match: 'mycelink\.mjs\S*\s+orchestrate\s+run'
    min: 1
    arm: with-only
  # Host-native path (the plugin's primary path after the 2026-10-06 pilot).
  - name: mycelink-host-dispatch
    type: tool_used
    tool: Bash
    input_match: 'mycelink\.mjs\S*\s+dispatch\s'
    min: 1
    arm: with-only
  - name: mycelink-worker-agent
    type: tool_used
    tool: Agent
    input_match: 'module-worker'
    min: 1
    arm: with-only
  - name: mycelink-settle
    type: tool_used
    tool: Bash
    input_match: 'mycelink\.mjs\S*\s+settle\s'
    min: 1
    arm: with-only
  - name: mycelink-deliver
    type: tool_used
    tool: Bash
    input_match: 'mycelink\.mjs\S*\s+deliver\s'
    min: 1
    arm: with-only
  - name: mycelink-control-plane-created
    type: file_exists
    path: '**/mycelink.config.json'
    arm: with-only
  - name: mycelink-feature-state-recorded
    type: file_exists
    path: '**/features/*/STATE.json'
    arm: with-only
  - name: mycelink-candidate-created
    type: file_exists
    path: '**/features/*/candidates/*.yaml'
    arm: with-only
