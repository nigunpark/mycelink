# ORD-101, the quickstart's portfolio graph.
#
#   feature -> repository slice -> capability -> executable node
#
#   ORD-101.api.status.impl  (orders-api, produces contract v2)
#            |
#            v
#   ORD-101.web.status.impl  (orders-web, consumes contract v2)
#            |
#            v
#   ORD-101.release.candidate.build  (controller: one immutable candidate)
#
# acceptance_criteria are copied verbatim from ACCEPTANCE.json, which
# `mycelink feature acceptance ORD-101 --source features/ORD-101/PRD.md`
# writes. Each verifier is its module's, as `mycelink repo modules` prints
# it (with module_sha256). Validate with: mycelink graph validate ORD-101
schema_version: 1
feature_id: ORD-101
title: Delayed orders with an expected delivery date
prd: PRD.md

acceptance_criteria:
  - id: AC-1
    kind: new-behavior
    text: "- **AC-1** Given an order record `{ id: \"A-7\", state: \"delayed\", eta: \"2026-11-03\" }`, when the API builds its status payload, then the payload is exactly `{ version: 2, id: \"A-7\", status: \"delayed\", eta: \"2026-11-03\" }`; every other payload carries `version: 2` and no `eta` field."
  - id: AC-2
    kind: new-behavior
    text: "- **AC-2** Given an order record with `state: \"delayed\"` whose `eta` is missing or is not a `YYYY-MM-DD` date, when the API builds its status payload, then it throws a `RangeError` whose message names the order id, and publishes nothing."
  - id: AC-3
    kind: new-behavior
    text: "- **AC-3** Given the payload `{ version: 2, id: \"A-7\", status: \"delayed\", eta: \"2026-11-03\" }`, when the web client renders it, then the line is exactly `Order A-7: Delayed, now expected 2026-11-03`."
  - id: AC-4
    kind: new-behavior
    text: "- **AC-4** Given a payload whose `status` the web client does not know, or that has no `status` at all, when the web client renders it, then the line is exactly `Order <id>: Status unavailable` and rendering never throws."

resources:
  full-runtime: { capacity: 1 }

repositories: [api, web]

capabilities:
  - id: CAP-API-STATUS-V2
    repository: api
    title: Publish order-status payloads at contract version 2
    acceptance_criteria: [AC-1, AC-2]
  - id: CAP-WEB-STATUS-V2
    repository: web
    title: Render order-status payloads at contract version 2
    acceptance_criteria: [AC-3, AC-4]

nodes:
  - id: ORD-101.api.status.impl
    level: executable-node
    repository: api
    capability: CAP-API-STATUS-V2
    node_type: implementation
    depends_on: []
    allowed_paths: ['orders/src/**', 'orders/test/**']
    forbidden_paths: []
    contract_inputs: []
    contract_outputs: ['contracts/order-status.v2.json']
    required_resources: []
    required_evidence: [red, green, regression]
    verification_commands:
      - id: module-orders
        module: orders
        module_sha256: c26ebc0bfae8e16b9ba86f03ee7fed75b44d1d750a64bafb2116fd9ab3b67bab
        command: [node, --test, --test-reporter=spec, --test-reporter-destination=stdout, --test-reporter=junit, '--test-reporter-destination=${REPORT}', 'orders/test/**/*.test.mjs']
    worker:
      model: sonnet
      effort: medium
      max_turns: 40
      max_wall_clock_minutes: 20
      max_attempts: 2
      nested_delegation: false
    invalidation_rules: []
    acceptance_criteria: [AC-1, AC-2]

  # The consumer depends on the producer of the contract it reads; the
  # validator refuses the graph otherwise (CONTRACT_HANDOFF_NOT_ORDERED).
  - id: ORD-101.web.status.impl
    level: executable-node
    repository: web
    capability: CAP-WEB-STATUS-V2
    node_type: implementation
    depends_on: [ORD-101.api.status.impl]
    allowed_paths: ['ui/src/**', 'ui/test/**']
    forbidden_paths: []
    contract_inputs: ['contracts/order-status.v2.json']
    contract_outputs: []
    required_resources: []
    required_evidence: [red, green, regression]
    verification_commands:
      - id: module-ui
        module: ui
        module_sha256: e8a5beed553e432df920a5fb6f06279a1073c8872b6e228c934577d2bc02696a
        command: [node, --test, --test-reporter=spec, --test-reporter-destination=stdout, --test-reporter=junit, '--test-reporter-destination=${REPORT}', 'ui/test/**/*.test.mjs']
    worker:
      model: sonnet
      effort: medium
      max_turns: 40
      max_wall_clock_minutes: 20
      max_attempts: 2
      nested_delegation: false
    invalidation_rules: []
    acceptance_criteria: [AC-3, AC-4]

  # Run by the controller, not a worker: binds the exact SHA of both
  # repositories (and the contract's hash) into one immutable manifest.
  - id: ORD-101.release.candidate.build
    level: executable-node
    repository: null
    capability: null
    node_type: candidate-build
    depends_on: [ORD-101.api.status.impl, ORD-101.web.status.impl]
    allowed_paths: []
    forbidden_paths: []
    contract_inputs: []
    contract_outputs: []
    required_resources: []
    required_evidence: [candidate]
    verification_commands:
      - id: candidate
        command: [mycelink, candidate, verify, ORD-101]
    worker:
      model: sonnet
      effort: low
      max_turns: 1
      max_wall_clock_minutes: 10
      max_attempts: 2
      nested_delegation: false
    invalidation_rules: []
    acceptance_criteria: []
