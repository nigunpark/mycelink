schema_version: 1
feature_id: PCM-101
title: Record which veterinarian handled a visit
prd: PRD.md
plan: PRD.md

acceptance_criteria:
  - { id: AC-1, text: "**AC-1 — storage (visits-service).** A visit has an optional veterinarian,\n`vetId`: a positive integer, or `null` when no vet is recorded. It is stored\nin the `visits` table as a nullable `vet_id` integer column, in both the\nHSQLDB and the MySQL schema. The existing seed visits have no vet.", kind: behaviour }
  - { id: AC-2, text: "**AC-2 — create (visits-service).** `POST /owners/{ownerId}/pets/{petId}/visits`\naccepts an optional `vetId` in its JSON body.\n\n- `vetId` absent or `null`: the visit is created exactly as today, with\n  `vetId: null`.\n- `vetId` ≥ 1: the visit is created with that vet.\n- `vetId` ≤ 0: the service answers `400 Bad Request` and stores nothing.", kind: behaviour }
  - { id: AC-3, text: "**AC-3 — read (visits-service).** Every visit representation visits-service\nreturns includes the `vetId` property (an integer or `null`): the `POST`\nresponse, `GET /owners/{ownerId}/pets/{petId}/visits` and\n`GET /pets/visits?petId=…`.", kind: behaviour }
  - { id: AC-4, text: "**AC-4 — a vet's visits (visits-service).** `GET /vets/{vetId}/visits`\nanswers `200` with a JSON array of the visits recorded for that vet,\nordered by visit date ascending, then by visit id ascending. It answers `200`\nwith `[]` when the vet has no visits. (Through the gateway this is\n`GET /api/visit/vets/{vetId}/visits`.)", kind: behaviour }
  - { id: AC-5, text: "**AC-5 — owner details (api-gateway).** In the response of\n`GET /api/gateway/owners/{ownerId}`, every visit of every pet has two more\nproperties:\n\n- `vetId`: as returned by visits-service;\n- `vetName`: `\"<firstName> <lastName>\"` of the vet with that id as returned\n  by vets-service `GET /vets` (service id `vets-service`), or `null` when the\n  visit has no vet or vets-service does not list that id.", kind: behaviour }
  - { id: AC-6, text: "**AC-6 — resilience (api-gateway).** When vets-service is unavailable or\nanswers with an error, `GET /api/gateway/owners/{ownerId}` still answers\n`200` with the owner, every pet and every visit; `vetId` is kept and\n`vetName` is `null`. The existing behaviour when visits-service is\nunavailable (the owner is returned with empty visit lists) is unchanged.", kind: behaviour }
  - { id: AC-7, text: "**AC-7 — compatibility.** Apart from the new properties, every response\nkeeps its current shape, status codes and property values. Existing clients\nthat ignore unknown properties keep working.", kind: compatibility }

resources:
